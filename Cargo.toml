[package]
name = "stopwatch"
version = "1.0.0"
description = "Always-on-top stopwatch with global hotkeys"
license = "MIT"
authors = ["Dennis Lehmann <mail@dennis-lehmann.de>"]
repository = "https://github.com/dlehmann/stopwatch"
readme = "README.md"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "default_fonts", "persistence"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
global-hotkey = "0.9.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[package.metadata.deb]
maintainer = "Dennis Lehmann <mail@dennis-lehmann.de>"
section = "utils"
extended-description = "Always-on-top stopwatch window with global hotkeys, measurement history, light/dark mode and German/English UI."
# X11 and OpenGL are loaded at runtime via dlopen.
depends = "$auto, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon-x11-0, libgl1"
assets = [
    ["target/release/stopwatch", "usr/bin/", "755"],
    ["packaging/linux/stopwatch.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/stopwatch.png", "644"],
    ["LICENSE", "usr/share/doc/stopwatch/", "644"],
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
